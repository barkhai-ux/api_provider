# Private AWS pilot overlay. Access the published ports through an SSH tunnel;
# do not open these ports in the Lightsail firewall.
services:
  nominatim:
    image: mediagis/nominatim:5.3
    profiles: [aws-test]
    environment:
      PBF_URL: https://download.geofabrik.de/asia/mongolia-260929.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/mongolia-updates/
      IMPORT_WIKIPEDIA: "false"
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?Set NOMINATIM_PASSWORD in .env}
      POSTGRES_SHARED_BUFFERS: 2GB
      POSTGRES_MAINTENANCE_WORK_MEM: 1GB
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
      - nominatim-flatnode:/nominatim/flatnode
    shm_size: 1gb
    mem_limit: 8g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/status >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  osrm-driving:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [aws-test]
    command: ["osrm-routed", "--algorithm", "mld", "/data/mongolia-driving.osrm"]
    volumes:
      - ./deploy/aws-test/data:/data:ro
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped

  osrm-walking:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [aws-test]
    command: ["osrm-routed", "--algorithm", "mld", "--port", "5001", "/data/mongolia-walking.osrm"]
    volumes:
      - ./deploy/aws-test/data:/data:ro
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped

  tileserver:
    image: maptiler/tileserver-gl:v5.4.0
    profiles: [aws-test]
    command: ["--file", "/data/mongolia.mbtiles"]
    volumes:
      - ./deploy/aws-test/data:/data:ro
    ports:
      - "127.0.0.1:8082:8080"
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  api-osm:
    build:
      context: ./apps/api
    profiles: [aws-test]
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      PUBLIC_API_URL: http://localhost:8001
      CONVEX_SITE_URL: http://convex-backend:3211
      API_INTERNAL_URL: http://api-osm:8000
      GEOCODING_PROVIDER: nominatim
      NOMINATIM_URL: http://nominatim:8080
      ROUTING_PROVIDER: osrm
      OSRM_DRIVING_URL: http://osrm-driving:5000
      OSRM_WALKING_URL: http://osrm-walking:5001
      API_KEY_PEPPER: ${API_KEY_PEPPER:?Set API_KEY_PEPPER in .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      SITE_API_KEY: ${SITE_API_KEY:?Set SITE_API_KEY in .env}
      AUTH_CACHE_TTL_SECONDS: "0"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      convex-deploy:
        condition: service_completed_successfully
      nominatim:
        condition: service_healthy
      osrm-driving:
        condition: service_started
      osrm-walking:
        condition: service_started
    restart: unless-stopped

  web-osm:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
        NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
        NEXT_PUBLIC_MAP_STYLE_URL: http://localhost:8082/styles/basic/style.json
    profiles: [aws-test]
    environment:
      API_INTERNAL_URL: http://api-osm:8000
      CONVEX_URL: http://convex-backend:3210
      CLIENT_IP_HEADER: ""
      TRUSTED_PROXY_HOPS: "0"
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      api-osm:
        condition: service_healthy
      tileserver:
        condition: service_started
    restart: unless-stopped

volumes:
  nominatim-data:
  nominatim-flatnode:
