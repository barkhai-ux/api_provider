map $http_upgrade $developers_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name developers.ubhub.mn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://developers.ubhub.mn$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name developers.ubhub.mn;
    ssl_certificate /etc/letsencrypt/live/developers.ubhub.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/developers.ubhub.mn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    include /etc/nginx/conf.d/developers-proxy.inc;
    location /convex/ {
        include /etc/nginx/conf.d/developers-proxy.inc;
        proxy_pass http://127.0.0.1:3210/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $developers_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    # Only auth discovery is public; internal gateway actions stay private.
    location /convex-site/.well-known/ {
        proxy_pass http://127.0.0.1:3211/.well-known/;
    }
    location /convex-site/ { return 404; }
    location /v1/ { proxy_pass http://127.0.0.1:8009; }
    location = /health { proxy_pass http://127.0.0.1:8009; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8009; }
    location / { proxy_pass http://127.0.0.1:8008; }
}
