# /etc/ssh/sshd_config.d/10-geo-hardening.conf
# Validate with `sshd -t` and keep a second session open while reloading.
# RHEL 9 reads sshd_config.d/*.conf first; the first value set wins.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
# Replace with your administrators; members of this group may log in.
AllowGroups sshadmins
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
LogLevel VERBOSE
