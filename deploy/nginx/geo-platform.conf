# Reverse proxy for a self-hosted Geo Platform (RHEL/Rocky/Alma, nginx from AppStream).
#
#   Browser ──443──► nginx ──► 127.0.0.1:8008  website (Next.js container)
#                         └──► 127.0.0.1:8009  public API (FastAPI container)
#
# 8008 and 8009 carry the SELinux label http_port_t, which nginx may connect to
# with `setsebool -P httpd_can_network_relay on` (no broader boolean needed).
#
# Install as /etc/nginx/conf.d/geo-platform.conf and replace:
#   app.example.com, api.example.com   your host names
#   /etc/pki/tls/...                   your certificate paths (e.g. from certbot)
# Then: nginx -t && systemctl reload nginx
#
# RHEL's /etc/nginx/nginx.conf ships its own default server on port 80: remove
# it, since the default servers below refuse unknown host names. Tested with
# nginx 1.20 (RHEL 9 default stream) and 1.26; on nginx 1.25.1+ `listen ... http2`
# logs a deprecation warning, replace it with `http2 on;` there.
#
# See docs/security/linux-hardening.md (SELinux port labels, firewalld).

# --- Limits shared by both sites ------------------------------------------------

server_tokens off;

# Small requests only: the API is GET-only, the website posts small forms.
client_max_body_size 64k;
client_body_buffer_size 16k;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;

# Slow-client (slowloris) protection.
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
# keepalive_timeout lives in nginx.conf; lower it there (for example to 30s).

# Coarse per-IP limits in front of the application limits (which are per key,
# per account and per visitor). They stop floods before they reach the apps.
limit_req_zone $binary_remote_addr zone=geo_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=geo_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=geo_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=geo_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Mozilla "intermediate" TLS profile.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:GeoTLS:10m;
ssl_session_tickets off;

# --- Unknown hosts: refuse (Host header attacks, IP scanning) ---------------------

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# --- HTTP → HTTPS ---------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com api.example.com;
    return 301 https://$host$request_uri;
}

# --- Website ----------------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/pki/tls/certs/app.example.com.fullchain.pem;
    ssl_certificate_key /etc/pki/tls/private/app.example.com.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    limit_conn geo_conn 50;

    # Sign-in, sign-up and password reset go through /api/auth: slow down guessing.
    location = /api/auth {
        limit_req zone=geo_auth burst=10 nodelay;
        include /etc/nginx/conf.d/geo-platform-proxy.inc;
        proxy_pass http://127.0.0.1:8008;
    }

    location / {
        limit_req zone=geo_web burst=60 nodelay;
        include /etc/nginx/conf.d/geo-platform-proxy.inc;
        proxy_pass http://127.0.0.1:8008;
    }
}

# --- Public API -------------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/pki/tls/certs/api.example.com.fullchain.pem;
    ssl_certificate_key /etc/pki/tls/private/api.example.com.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    limit_conn geo_conn 50;

    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        limit_req zone=geo_api burst=40 nodelay;
        include /etc/nginx/conf.d/geo-platform-proxy.inc;
        proxy_pass http://127.0.0.1:8009;
    }
}
